<!doctype html>
<!-- The social preview image (public/og.jpg). Render at 1200×630, e.g. with tools/og-render.cjs (headless Chrome). -->
<html>
<head>
<meta charset="utf-8">
<style>
	@font-face { font-family: Manrope; src: url("../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
	* { margin: 0; box-sizing: border-box; }
	html, body { width: 1200px; height: 630px; overflow: hidden; font-family: Manrope, sans-serif; color: #f3f2f7; -webkit-font-smoothing: antialiased; }
	body { position: relative; background:
		radial-gradient(115% 105% at 50% 6%, transparent 72%, rgba(104, 40, 255, 0.06) 82%, rgba(124, 40, 255, 0.14) 92%, rgba(150, 50, 255, 0.19) 100%),
		#050507; }
	.chapter { position: absolute; left: 72px; right: 0; top: 64px; height: 28px; display: flex; align-items: center; gap: 12px; }
	.marker { align-self: stretch; width: 2px; border-radius: 1px; background: #8c28ff; }
	.number { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #b089f0; }
	.name { font-size: 14px; font-weight: 600; }
	.ruler { flex: 1; align-self: flex-end; height: 12px; margin-left: 8px;
		background:
			linear-gradient(rgba(255,255,255,0.12), rgba(255,255,255,0.12)) left bottom / 100% 1px no-repeat,
			repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, transparent 1px 64px) left bottom / 100% 12px no-repeat,
			repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 8px) left bottom / 100% 6px no-repeat; }
	.copy { position: absolute; left: 72px; top: 168px; width: 500px; }
	h1 { font-size: 66px; line-height: 1.04; letter-spacing: -0.04em; font-weight: 600; }
	h1 span { color: #a35cff; }
	p { margin-top: 28px; font-size: 21px; line-height: 1.5; color: #9d9aab; font-weight: 500; letter-spacing: -0.005em; }
	.shot { position: absolute; left: 640px; top: 168px; width: 780px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); }
</style>
</head>
<body>
	<div class="chapter"><span class="marker"></span><span class="number">01</span><span class="name">Nebula</span><span class="ruler"></span></div>
	<div class="copy">
		<h1>Screen recordings that <span>edit themselves.</span></h1>
		<p>A free, open-source screen recorder for macOS. One click adds the zooms, cuts and smooth cursor.</p>
	</div>
	<img class="shot" src="../src/assets/shots/editor.png" alt="">
</body>
</html>
