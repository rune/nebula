<!doctype html>
<!-- The social preview image (public/og.jpg). Render at 1200×630, e.g. with tools/demo's Electron. -->
<html>
<head>
<meta charset="utf-8">
<style>
	@font-face { font-family: Manrope; src: url("../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; }
	* { margin: 0; box-sizing: border-box; }
	html, body { width: 1200px; height: 630px; overflow: hidden; background: #040406; font-family: Manrope, sans-serif; color: #f3f2f7; }
	.copy { position: absolute; left: 72px; top: 76px; width: 520px; }
	.brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 780; }
	h1 { margin-top: 44px; font-size: 64px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 790; }
	h1 span { background: linear-gradient(100deg, #d9c8ff, #b089f0 45%, #8c28ff); -webkit-background-clip: text; color: transparent; }
	p { margin-top: 26px; font-size: 21px; line-height: 1.5; color: #a09ead; font-weight: 560; }
	.shot { position: absolute; left: 640px; top: 96px; width: 820px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 40px 80px -20px rgba(0,0,0,0.9); }
	.ring { position: absolute; left: -140px; top: 300px; width: 1500px; height: 360px; border: 1.2px solid rgba(176,137,240,0.2); border-radius: 50%; transform: rotate(-9deg); }
</style>
</head>
<body>
	<div class="ring"></div>
	<img class="shot" src="../src/assets/shots/editor.png" alt="">
	<div class="copy">
		<div class="brand">

			Nebula
		</div>
		<h1>Screen recordings that <span>edit themselves.</span></h1>

</html>
