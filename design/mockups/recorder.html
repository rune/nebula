<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nebula — Recorder</title>
<link rel="stylesheet" href="tokens.css">
<style>
	body { width: 1600px; height: 1000px; position: relative; overflow: hidden;
		background: radial-gradient(900px 600px at 20% 30%, #3a2c6e, transparent 70%), radial-gradient(900px 700px at 85% 80%, #1f4a73, transparent 70%), linear-gradient(160deg, #23263a, #121522); }
	.menubar { position: absolute; top: 0; left: 0; right: 0; height: 30px; background: rgba(20,20,28,0.55); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 16px; gap: 20px; font-size: 13px; font-weight: 600; color: #e9e8ef; }
	.menubar .right { margin-left: auto; display: flex; gap: 18px; align-items: center; }
	.nebula-icon { width: 20px; height: 20px; border-radius: 6px; background: radial-gradient(circle at 35% 35%, #d9b8ff, #8C28FF 45%, #2a0f6e 100%);  }
	/* Fake desktop app being recorded */
	.appwin { position: absolute; left: 330px; top: 150px; width: 940px; height: 560px; border-radius: 12px; background: #f6f6f8; box-shadow: 0 30px 80px rgba(0,0,0,0.45); overflow: hidden; }
	.appwin .bar { height: 40px; background: #ececf0; border-bottom: 1px solid #ddd; }
	.appwin .grid { display: grid; grid-template-columns: 200px 1fr; height: 520px; }
	.appwin .grid div:first-child { background: #efeff3; border-right: 1px solid #e2e2e8; }
	/* Area selection */
	.dim { position: absolute; inset: 0; background: rgba(4,4,8,0.55); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, 380px 190px, 380px 690px, 1220px 690px, 1220px 190px, 380px 190px); }
	.sel { position: absolute; left: 380px; top: 190px; width: 840px; height: 500px; border: 1.5px solid rgba(176,137,240,0.95); box-shadow: 0 0 0 1px rgba(0,0,0,0.4); border-radius: 4px; }
	.sel i { position: absolute; width: 10px; height: 10px; background: #fff; border-radius: 3px; box-shadow: 0 0 0 1.5px #8C28FF; }
	.sizeTag { position: absolute; left: 50%; top: -38px; transform: translateX(-50%); display: flex; gap: 6px; }
	.sizeTag span { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; background: rgba(12,12,17,0.92); border: 1px solid var(--hairline-strong); }
	.sizeTag span.preset { color: var(--lavender); }
	/* Recording bar */
	.bar-panel { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 9px; border-radius: 18px; background: rgba(10,10,14,0.88); backdrop-filter: blur(30px) saturate(140%); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.06) inset; }
	.modes { display: flex; gap: 3px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 3px; }
	.mode { width: 76px; height: 52px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--text-3); }
	.mode.on { background: var(--surface-3); color: var(--text-1); box-shadow: 0 0 0 1px var(--hairline-strong) inset; }
	.mode .icon { width: 18px; height: 18px; }
	.divider { width: 1px; height: 36px; background: var(--hairline-strong); margin: 0 2px; }
	.picker { height: 52px; padding: 0 14px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 168px; white-space: nowrap; background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); }
	.picker small { font-size: 10.5px; font-weight: 700; color: var(--text-3); letter-spacing: 0.03em; text-transform: uppercase; }
	.picker b { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
	.meter { display: flex; gap: 2px; margin-left: 4px; }
	.meter i { width: 3px; border-radius: 2px; background: #3ddc97; }
	.iconbtn { width: 44px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-2); background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); }
	.iconbtn.on { color: var(--lavender); background: rgba(140,40,255,0.12); border-color: rgba(160,95,255,0.4); }
	.iconbtn .icon { width: 18px; height: 18px; }
	.record { height: 52px; padding: 0 18px 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 800; background: var(--gradient); box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset; }
	.record .dot { width: 18px; height: 18px; border-radius: 50%; background: #fff;  }
	.record .kbd { color: rgba(255,255,255,0.75); border-color: rgba(255,255,255,0.35); }
	/* Options popover */
	.pop { position: absolute; left: 50%; bottom: 128px; transform: translateX(118px); width: 268px; border-radius: 14px; padding: 8px; background: rgba(12,12,17,0.94); border: 1px solid var(--hairline-strong); box-shadow: 0 24px 60px rgba(0,0,0,0.6); backdrop-filter: blur(30px); }
	.pop .row { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 650; color: var(--text-1); }
	.pop .row span { color: var(--text-3); font-weight: 600; }
	.pop hr { border: 0; border-top: 1px solid var(--hairline); margin: 4px 6px; }
	.toggle { width: 30px; height: 18px; border-radius: 999px; background: var(--violet); position: relative; }
	.toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
	.toggle.off { background: var(--surface-3); }
	.toggle.off::after { right: auto; left: 2px; background: #8b8996; }
</style>
</head>
<body>
	<div class="menubar"><span></span><b></b><span>Finder</span><span>File</span><span>Edit</span><span>View</span><div class="right"><div class="nebula-icon"></div><span>Thu 16 Oct 21:04</span></div></div>
	<div class="appwin"><div class="bar"></div><div class="grid"><div></div><div></div></div></div>
	<div class="dim"></div>
	<div class="sel">
		<div class="sizeTag"><span>1680 × 1000 px</span><span class="preset">16:10</span></div>
		<i style="left:-6px;top:-6px"></i><i style="right:-6px;top:-6px"></i><i style="left:-6px;bottom:-6px"></i><i style="right:-6px;bottom:-6px"></i>
		<i style="left:calc(50% - 5px);top:-6px"></i><i style="left:calc(50% - 5px);bottom:-6px"></i><i style="left:-6px;top:calc(50% - 5px)"></i><i style="right:-6px;top:calc(50% - 5px)"></i>
	</div>

	<div class="pop">
		<div class="row">Countdown<span>3 s</span></div>
		<div class="row">Hide desktop icons<div class="toggle"></div></div>
		<div class="row">Speaker notes<div class="toggle off"></div></div>
		<hr>
		<div class="row">Show keyboard shortcuts<div class="toggle"></div></div>
		<div class="row">Frame rate<span>60 fps</span></div>
	</div>

	<div class="bar-panel">
		<div class="modes">
			<div class="mode"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Display</div>
			<div class="mode"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>Window</div>
			<div class="mode on"><svg class="icon" viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>Area</div>
		</div>
		<div class="divider"></div>
		<div class="picker"><small>Display</small><b>Built-in Retina <svg class="icon" viewBox="0 0 24 24" style="width:12px"><path d="m6 9 6 6 6-6"/></svg></b></div>
		<div class="picker"><small>Microphone</small><b>MacBook Pro Mic <span class="meter"><i style="height:6px"></i><i style="height:11px"></i><i style="height:8px"></i><i style="height:13px;background:#3ddc97"></i><i style="height:5px;background:#2a2a33"></i></span></b></div>
		<div class="iconbtn on"><svg class="icon" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></div>
		<div class="iconbtn"><svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></div>
		<div class="divider"></div>
		<div class="record"><span class="dot"></span>Record <span class="kbd">⌥⌘↩</span></div>
	</div>
</body>
</html>
